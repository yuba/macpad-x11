# macpad-x11 configuration
# Copy to ~/.config/macpad-x11/config.ini and edit; every setting is optional.
# Apply changes with: systemctl --user reload macpad-x11.service
# (enabling or disabling a whole feature needs: systemctl --user restart macpad-x11.service)
# Comments: lines starting with # or ;, and " #" after a value (except in
# launcher_command, which goes to a shell as written). Yes/no settings take
# yes, no, true, false, on, off, 1 or 0.

[drag]
# Three-finger drag.
enabled = yes

# Grace period after lifting the fingers, in seconds.
# Put the fingers back within this time to continue the drag.
timeout = 0.5

# Ignore pointer events for this long right after the swipe ends, in seconds.
# Raise it (e.g. 0.03) if drags end unexpectedly while lifting the fingers.
lift_guard = 0.0

# Pointer movement per unit of swipe movement.
speed = 3.0

# Number of fingers that start a drag.
fingers = 3

[swipe]
# Swipe sideways with four fingers to switch to the desktop on the left or
# right (needs a window manager with EWMH desktops: Xfwm4, KWin, Mutter,
# Openbox, i3, ...). Fingers to the left bring in the desktop on the right.
enabled = yes

# Number of fingers. Must differ from [drag] fingers.
fingers = 4

# Finger movement for one desktop; a swipe past half of it switches.
distance = 300

# Go from the last desktop on to the first and the other way round.
wrap = no

# Show the desktops while swiping.
hud = yes

# Fingers to the left go to the desktop on the left instead.
reverse = no

[pinch4]
# Pinch with four fingers (thumb and three fingers, like a Mac): spread to
# show the desktop, pinch in to open a launcher. Pinching in while the
# desktop is shown brings the windows back instead; once a window shows up,
# pinching in opens the launcher again. The window manager must support
# EWMH "show desktop" (_NET_SHOWING_DESKTOP).
enabled = yes

# Number of fingers. libinput reports at most four for a pinch, so a
# five-finger pinch counts as four. Must not be 2 (that is [pinch]).
fingers = 4

# Spreading the fingers to this scale shows the desktop.
out_scale = 1.5

# Pinching them in to this scale opens the launcher or brings the windows back.
in_scale = 0.7

# Spread to show the desktop.
show_desktop = yes

# Keys to press when pinching in, e.g. super or ctrl+escape. Empty: none.
launcher_keys =

# Shell command to run when pinching in (after launcher_keys). It runs with
# sh -c exactly as written, over as many indented lines as you like, so ;
# runs commands one after another and || tries the next one if one fails.
# Mind that the INI file drops continuation lines that start with ; or #.
# The default picks the launcher of the desktop you are logged in to
# ($XDG_CURRENT_DESKTOP): exit codes do not tell reliably whether a launcher
# opened. Only the Xfce one has been tested. Empty: none.
launcher_command =
    case "$XDG_CURRENT_DESKTOP" in
      *XFCE*) xfce4-popup-whiskermenu || xfce4-popup-applicationsmenu ;;
      *KDE*) qdbus6 org.kde.plasmashell /PlasmaShell org.kde.PlasmaShell.activateLauncherMenu ||
             qdbus org.kde.plasmashell /PlasmaShell org.kde.PlasmaShell.activateLauncherMenu ;;
      *GNOME*) gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell --method org.gnome.Shell.ShowApplications ;;
      *) if command -v rofi >/dev/null; then rofi -show drun; else xfce4-appfinder; fi ;;
    esac

# Show four fingertips gathering or spreading in the middle of the screen,
# turning solid yellow when the pinch is far enough.
hud = yes

[inertia]
# Keep scrolling after a quick two-finger scroll, slowing down, like a Mac.
# Only in the apps with inertia = yes (see apps.ini and the [app ...]
# sections below); GTK 3 apps already do it by themselves. Touching the
# touchpad stops it, and that touch does not click.
enabled = yes

# How fast the scrolling slows down: the time, in seconds, after which its
# speed has dropped to about a third.
decay = 0.4

# Speed at the start, relative to the fingers' speed when lifted.
speed = 1.0

# Scrolling slower than this, in touchpad pixels per second, does not glide
# on or stops.
min_speed = 100

[pinch]
# Pinch to zoom around the pointer.
enabled = yes

# Finger distance at the start of a touch pinch, in pixels.
spread = 400

# Finger distance change before a touch pinch starts, in pixels. Smaller
# movements make some apps see a two-finger tap and open a context menu.
slop = 40

# Pan movement per unit of finger movement while pinching; negative values
# reverse the direction.
pan_speed = 1.0

# Pan movement per wheel click for pan = wheel, in pixels.
pan_step = 40

[pinch.default]
# Settings for apps that are not in apps.ini or in an [app ...] section
# below (zoom, and inertia too despite the name).
# Takes the same keys as an [app ...] section.
zoom = keys

# Per-app settings: a section named "app" plus the WM_CLASS class or instance
# name (or a glob like vivaldi*). They override the bundled apps.ini key by
# key. Find the name with tools/probe, or with
#   xprop WM_CLASS   (then click the window: "instance", "class").
#
# [app Some-app]
# zoom = wheel             # touch, wheel, keys or none
#                          #   touch: virtual touchscreen (smooth, pans too)
#                          #   wheel: wheel clicks at the pointer
#                          #   keys:  zoom_in / zoom_out key presses
# modifier = ctrl          # held during zoom wheel clicks: ctrl, shift, alt, super,
#                          # or nothing after the = for none
# step = 1.2               # zoom factor of one wheel click or key press in the app
# zoom_in = ctrl+plus      # keys for zoom = keys
# zoom_out = ctrl+minus
# pan = wheel              # pan while pinching with wheel clicks: wheel or none
# pan_horizontal = buttons # horizontal wheel: buttons (6/7) or shift (Shift+wheel)
# requires_env = NAME=VALUE  # use this section only if the app's process has this
#                          # environment variable (NAME alone: any value);
#                          # otherwise the app gets [pinch.default]
# inertia = yes            # glide on after a two-finger scroll; not for apps
#                          # that do it themselves (GTK 3), or they glide twice
