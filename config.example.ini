# macpad-x11 configuration
# Copy to ~/.config/macpad-x11/config.ini and edit; every setting is optional.
# Apply changes with: systemctl --user reload macpad-x11.service
# (enabling or disabling a whole feature needs: systemctl --user restart macpad-x11.service)
# Comments start with # or ;. Yes/no settings take yes, no, true, false, on, off, 1 or 0.

[drag]
# Three-finger drag.
enabled = yes

# Grace period after lifting the fingers, in seconds.
# Put the fingers back within this time to continue the drag.
timeout = 0.5

# Ignore pointer events for this long right after the swipe ends, in seconds.
# Raise it (e.g. 0.03) if drags end unexpectedly while lifting the fingers.
lift_guard = 0.0

# Pointer movement per unit of swipe movement.
speed = 3.0

# Number of fingers that start a drag.
fingers = 3

[pinch]
# Pinch to zoom around the pointer.
enabled = yes

# Finger distance at the start of a touch pinch, in pixels.
spread = 400

# Finger distance change before a touch pinch starts, in pixels. Smaller
# movements make some apps see a two-finger tap and open a context menu.
slop = 40

# Pan movement per unit of finger movement while pinching; negative values
# reverse the direction.
pan_speed = 1.0

# Pan movement per wheel click for pan = wheel, in pixels.
pan_step = 40

[pinch.default]
# How to zoom apps that are not in apps.ini or in an [app ...] section below.
# Takes the same keys as an [app ...] section.
zoom = keys

# Per-app settings: a section named "app" plus the WM_CLASS class or instance
# name (or a glob like vivaldi*). They override the bundled apps.ini key by
# key. Find the name with tools/probe, or with
#   xprop WM_CLASS   (then click the window: "instance", "class").
#
# [app Some-app]
# zoom = wheel             # touch, wheel, keys or none
#                          #   touch: virtual touchscreen (smooth, pans too)
#                          #   wheel: wheel clicks at the pointer
#                          #   keys:  zoom_in / zoom_out key presses
# modifier = ctrl          # held during zoom wheel clicks: ctrl, shift, alt, super,
#                          # or nothing after the = for none
# step = 1.2               # zoom factor of one wheel click or key press in the app
# zoom_in = ctrl+plus      # keys for zoom = keys
# zoom_out = ctrl+minus
# pan = wheel              # pan while pinching with wheel clicks: wheel or none
# pan_horizontal = buttons # horizontal wheel: buttons (6/7) or shift (Shift+wheel)
# requires_env = NAME=VALUE  # use this section only if the app's process has this
#                          # environment variable (NAME alone: any value);
#                          # otherwise the app gets [pinch.default]
