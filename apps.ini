# How macpad-x11 makes each application zoom around the pointer when you
# pinch, and which applications get inertial scrolling from it.
#
# Each [app NAME] section is matched against the WM_CLASS of the window under
# the pointer: the class name first, then the instance name, exactly, then
# ignoring case, then as globs ("vivaldi*" covers Vivaldi-stable,
# Vivaldi-flatpak, ...). The first glob that matches wins. The keys are
# described in config.example.ini; [app NAME] sections in your config.ini
# override these key by key.
#
# Every entry below was measured with tools/probe on X11 (Manjaro, Xfce,
# October 2026); "step" is the app's own zoom factor per wheel click or key
# press. Apps that are not listed get [pinch.default] (zoom = keys).
#
# To add an app, run tools/probe on it (see the README) and send a pull
# request with its suggested entry and the probe.png contact sheet. Do not
# set zoom = touch for an app that does not zoom on touchscreen pinches:
# X then turns the virtual fingers into a mouse drag.
#
# inertia = yes only for apps that stop dead when the fingers are lifted
# from a two-finger scroll. GTK 3 apps (evince, Thunar, ...) glide on by
# themselves and must not get it, or they would glide twice.

# --- Web browsers ------------------------------------------------------------

# Chrome and the browsers built on Chromium zoom smoothly (visual zoom, like
# a Mac) and pan while pinching. They stop dead after a scroll on X11.
[app google-chrome*]
zoom = touch
inertia = yes

# Chromium (Arch), chromium-browser (Debian/Ubuntu), Org.chromium.Chromium (Flatpak)
[app *chromium*]
zoom = touch
inertia = yes

[app brave*]
zoom = touch
inertia = yes

[app microsoft-edge*]
zoom = touch
inertia = yes

# Zooms smoothly, but the anchor lands a little off the pointer.
[app vivaldi*]
zoom = touch
inertia = yes

# Firefox handles touchscreen pinches only when started with MOZ_USE_XINPUT2=1
# in its environment (e.g. export it in ~/.xprofile). Without it, touch
# pinches would turn into a drag, so such a Firefox gets [pinch.default].
# (A Flatpak Firefox's environment cannot be read, so it always does.)
[app firefox*]
zoom = touch
requires_env = MOZ_USE_XINPUT2=1

# --- Code editors --------------------------------------------------------------

# VS Code and the other Electron editors built on it (Chromium inside). They
# turn pinch zoom off, so only inertia.
# Code (Microsoft), code-oss (Arch), VSCodium, Cursor
[app code]
inertia = yes

[app code-oss]
inertia = yes

[app vscodium]
inertia = yes

[app cursor]
inertia = yes

# Zed draws everything itself (GPUI) and does not glide on X11.
[app dev.zed.Zed]
inertia = yes

# --- Terminals -----------------------------------------------------------------

# None of these glide on by themselves on X11. The VTE terminals are GTK 3,
# but VTE is not in a GtkScrolledWindow, which is what glides in GTK 3. The
# GTK 4 ones (GNOME Console, Ptyxis, Ghostty) are left out until checked:
# GTK 4's VTE may glide by itself.
[app guake]
inertia = yes

[app xfce4-terminal]
inertia = yes

# (not checked)
[app gnome-terminal*]
inertia = yes

# (not checked)
[app terminator]
inertia = yes

# (not checked)
[app lxterminal]
inertia = yes

# (not checked)
[app mate-terminal]
inertia = yes

# (not checked)
[app tilda]
inertia = yes

# com.gexperts.Tilix (not checked)
[app tilix]
inertia = yes

# Qt (not checked)
[app qterminal]
inertia = yes

[app konsole]
inertia = yes

[app yakuake]
inertia = yes

# (not checked)
[app org.wezfurlong.wezterm]
inertia = yes

[app kitty]
inertia = yes

[app alacritty]
inertia = yes

# Whole wheel clicks only: they glide on a few lines at a time. (not checked)
[app xterm]
inertia = yes

[app urxvt]
inertia = yes

# --- Document viewers ----------------------------------------------------------

[app evince]
zoom = wheel
modifier = ctrl
step = 1.18
pan = wheel

# GNOME's newer document viewer. Its wheel scrolls the other way round while
# zoomed, so no panning.
[app papers]
zoom = wheel
modifier = ctrl
step = 1.2

# Has no pointer-anchored zoom: zooms around the view, but at least zooms
# (zathura has no Ctrl+plus binding).
[app *zathura*]
zoom = wheel
modifier = ctrl
step = 1.1

# Com.github.xournalpp.xournalpp (Flatpak), Xournalpp
[app *xournalpp*]
zoom = wheel
modifier = ctrl
step = 1.02

# --- Image viewers -----------------------------------------------------------

[app eog]
zoom = touch

[app loupe]
zoom = wheel
step = 1.3

[app ristretto]
zoom = wheel
modifier = ctrl
step = 1.1

[app viewnior]
zoom = wheel
modifier = ctrl
step = 1.1

# Org.gnome.gThumb (Flatpak), Gthumb
[app *gthumb*]
zoom = wheel
modifier = ctrl
step = 1.1

# nomacs
[app Image Lounge]
zoom = wheel
modifier = ctrl
step = 1.1

# Its zoom keys zoom at the pointer.
[app gwenview]
zoom = keys
step = 1.42
pan = wheel

# --- Media players -------------------------------------------------------------

# mpv's default input.conf binds Ctrl+wheel to cursor-centric-zoom (tested with
# 0.41; the anchor lands a little off the pointer). Its plain wheel seeks, so
# no panning.
[app mpv]
zoom = wheel
modifier = ctrl
step = 1.14

# --- Graphics ------------------------------------------------------------------

[app gimp*]
zoom = touch

[app inkscape]
zoom = touch

[app krita]
zoom = touch
